# Testprofil für die Integrationstests (LB2).
# Die Datenbank-Verbindung liefert der Testcontainers-PostgreSQL-Container
# (siehe IntegrationTestBase). Das Schema wird aus den Entitäten erzeugt,
# die Seed-Daten aus data.sql werden NICHT eingespielt, damit jeder Test
# auf einem kontrollierten, leeren Datenbestand startet.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
