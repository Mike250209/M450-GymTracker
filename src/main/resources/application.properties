spring.application.name=gymtracker

# Lokale PostgreSQL-Installation (ohne Docker)
spring.datasource.url=jdbc:postgresql://localhost:5432/gymtracker
spring.datasource.username=postgres
spring.datasource.password=123

# Tabellen automatisch aus den Entitäten erzeugen, danach data.sql einspielen
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
