name: Tests & Mutation-Testing

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # PostgreSQL als Service-Container; die Integrationstests verbinden sich direkt
    # dagegen (zuverlässiger als Testcontainers auf dem Runner).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gymtracker
          POSTGRES_USER: gymtracker
          POSTGRES_PASSWORD: gymtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymtracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/gymtracker
      SPRING_DATASOURCE_USERNAME: gymtracker
      SPRING_DATASOURCE_PASSWORD: gymtracker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Tests (Unit + Integration)
        run: mvn -B test

      - name: Mutation-Testing (PIT)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: PIT-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports
