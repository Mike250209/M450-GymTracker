name: Tests & Mutation-Testing

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Der Docker-Daemon der GitHub-Runner verlangt API >= 1.40; ohne diese
      # Vorgabe meldet sich der Testcontainers-Client mit der veralteten 1.32.
      DOCKER_API_VERSION: "1.43"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Tests (Unit + Integration)
        run: mvn -B test

      - name: Mutation-Testing (PIT)
        run: mvn -B test-compile org.pitest:pitest-maven:mutationCoverage

      - name: PIT-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports
